<html>
<head>
<title>My Website</title>
</head>
<body>
<h1>LEARNER ASSESSMENT PORTAL</h1>

<form>
<label for="username">Username:</label><br>
<input type="text" id="username" name="username"><br><br>

<label for="password">Password:</label><br>
<input type="password" id="password" name="password"><br><br>

<p>Gender:</p>
<input type="radio" id="male" name="gender" value="male">
<label for="male">Male</label><br>
<input type="radio" id="female" name="gender" value="female">
<label for="female">Female</label><br><br>

<p>Hobbies:</p>
<input type="checkbox" id="hobby1" name="hobby1" value="TV">
<label for="hobby1">TV</label><br>
<input type="checkbox" id="hobby2" name="hobby2" value="READING">
<label for="hobby2">READING</label><br>
<input type="checkbox" id="hobby3" name="hobby3" value="COOKING">
<label for="hobby3">COOKING</label><br><br>

<p>COUNTRY:</p>
<label for="country">Choose a country:</label>
<select name="country" id="country">
<option value="South Africa">South Africa</option>
<option value="China">China</option>
<option value="Australia">Australia</option>
<option value="United States Of America">United States Of America</option>
</select><br><br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">

</form>
</body>
</html>
